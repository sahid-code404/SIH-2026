spring:
  application:
    name: nirikshanx-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nirikshanx}
    username: ${DATABASE_USERNAME:nirikshan}
    password: ${DATABASE_PASSWORD:nirikshan_dev_only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO

spring:
  application:
    name: nirikshanx-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/nirikshanx}
    username: ${DATABASE_USERNAME:nirikshan}
    password: ${DATABASE_PASSWORD:nirikshan_dev_only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

nirikshanx:
  auth:
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT10M}
    session-ttl: ${AUTH_SESSION_TTL:P30D}
    mfa-challenge-ttl: ${AUTH_MFA_CHALLENGE_TTL:PT5M}
    issuer: ${AUTH_JWT_ISSUER:nirikshanx}
    audience: ${AUTH_JWT_AUDIENCE:nirikshanx-web}
    jwt-secret-base64: ${AUTH_JWT_SECRET_BASE64:}
    mfa-encryption-key-base64: ${AUTH_MFA_ENCRYPTION_KEY_BASE64:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-window: ${AUTH_LOGIN_WINDOW:PT15M}
  bootstrap-user:
    enabled: ${BOOTSTRAP_USER_ENABLED:false}
    email: ${BOOTSTRAP_USER_EMAIL:}
    display-name: ${BOOTSTRAP_USER_DISPLAY_NAME:}
    password: ${BOOTSTRAP_USER_PASSWORD:}
    preferred-language: ${BOOTSTRAP_USER_PREFERRED_LANGUAGE:en}

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO

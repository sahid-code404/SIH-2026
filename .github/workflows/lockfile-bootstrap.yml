name: Bootstrap web lockfile

on:
  push:
    branches: ["phase/00-foundation"]

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate and commit npm lockfile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/00-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Generate package-lock from reviewed direct pins
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package-lock is synchronized
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        working-directory: .
        run: |
          if git diff --quiet -- apps/web/package-lock.json && git ls-files --error-unmatch apps/web/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "build: lock web dependency graph"
          git push origin HEAD:phase/00-foundation

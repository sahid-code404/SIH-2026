name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Test and package
        run: gradle -p backend clean test bootJar --no-daemon

  web:
    name: Web lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - name: Verify direct dependency pins
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(p[group] || {})) {
              if (/^[~^*]|\s|[<>=|]/.test(version)) {
                throw new Error(`${name} is not exactly pinned: ${version}`);
              }
            }
          }
          NODE
      - run: npm install --no-audit --no-fund --allow-scripts=@tailwindcss/oxide,unrs-resolver
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:8080

  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

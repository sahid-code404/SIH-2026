name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Test and package
        run: gradle -p backend clean test bootJar --no-daemon

  web:
    name: Web lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify direct dependency pins
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(p[group] || {})) {
              if (/^[~^*]|\s|[<>=|]/.test(version)) {
                throw new Error(`${name} is not exactly pinned: ${version}`);
              }
            }
          }
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://127.0.0.1:8080

  compose-config:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  integration-smoke:
    name: Full stack integration smoke
    runs-on: ubuntu-latest
    needs: [backend, web, compose-config]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for backend readiness
        run: |
          timeout 300 bash -c 'until curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null; do sleep 3; done'
      - name: Wait for web health
        run: |
          timeout 180 bash -c 'until curl -fsS http://127.0.0.1:3000/api/health >/dev/null; do sleep 3; done'
      - name: Verify database, Redis and same-origin backend route
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/system/status | tee /tmp/backend-status.json
          jq -e '.status == "UP" and .components.database.status == "UP" and .components.redis.status == "UP"' /tmp/backend-status.json
          curl -fsS http://127.0.0.1:3000/backend-api/api/v1/system/status | tee /tmp/web-proxy-status.json
          jq -e '.status == "UP" and .components.database.status == "UP" and .components.redis.status == "UP"' /tmp/web-proxy-status.json
      - name: Verify PostGIS migration
        run: |
          docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT PostGIS_Version();"' | tee /tmp/postgis-version.txt
          test -s /tmp/postgis-version.txt
      - name: Verify database-core migration and constraints
        run: |
          docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < scripts/verify_database_core.sql
      - name: Verify authentication and session security
        run: node scripts/verify_authentication.mjs
      - name: Verify responsive browser behavior
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/nirikshanx-chrome-cdp \
            about:blank >/tmp/nirikshanx-chrome.log 2>&1 &
          BROWSER_PID=$!
          trap 'kill "$BROWSER_PID" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:9222/json/version >/dev/null; do sleep 1; done'
          node apps/web/tests/browser-smoke.mjs
      - name: Capture desktop and mobile regression renders
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          mkdir -p /tmp/nirikshanx-ui
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,1200 --screenshot=/tmp/nirikshanx-ui/desktop-1440x1200.png http://127.0.0.1:3000
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3500 --window-size=390,844 --screenshot=/tmp/nirikshanx-ui/mobile-390x844.png http://127.0.0.1:3000
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=/tmp/nirikshanx-ui/login-mobile-390x844.png http://127.0.0.1:3000/login
          test -s /tmp/nirikshanx-ui/desktop-1440x1200.png
          test -s /tmp/nirikshanx-ui/mobile-390x844.png
          test -s /tmp/nirikshanx-ui/login-mobile-390x844.png
      - name: Upload UI regression render evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-04-regression-ui-renders
          path: /tmp/nirikshanx-ui/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Show stack diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=250
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
